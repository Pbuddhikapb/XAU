name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xau_user
          POSTGRES_PASSWORD: xau_pass_2026
          POSTGRES_DB: xau_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy
          pip install -e .

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://xau_user:xau_pass_2026@localhost:5432/xau_intelligence
          SYNC_DATABASE_URL: postgresql+psycopg2://xau_user:xau_pass_2026@localhost:5432/xau_intelligence
        run: |
          alembic upgrade head

      - name: Lint with Ruff
        run: |
          ruff check backend/ analytical_engine/ tests/

      - name: Type check with Mypy
        run: |
          mypy backend/ analytical_engine/

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://xau_user:xau_pass_2026@localhost:5432/xau_intelligence
          SYNC_DATABASE_URL: postgresql+psycopg2://xau_user:xau_pass_2026@localhost:5432/xau_intelligence
        run: |
          pytest tests/ analytical_engine/tests/
