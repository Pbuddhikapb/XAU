# ==============================================================================
# Binance XAUUSDT Production Nginx Reverse Proxy & SSL Configuration
# Proxy passes standard web traffic (Port 80/443) to FastAPI + Dashboard on :8000
# Supports high-throughput persistent WebSocket upgrades for live telemetry.
# ==============================================================================

upstream xau_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 1. HTTP Server (Port 80) -> Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is generated)
    # return 301 https://$host$request_uri;

    # Default proxy for direct HTTP IP access
    location / {
        proxy_pass http://xau_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

